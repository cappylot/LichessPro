name: Release

# Builds the desktop installers. macOS and Windows binaries can only be
# produced on their own runners, which is the whole reason this exists.
on:
  push:
    tags: ['v*']
  workflow_dispatch: # so a build can be produced without cutting a tag

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: false # one platform failing should not hide the other's result
      matrix:
        include:
          - os: macos-latest
            target: --mac
            artifact: macos
          - os: windows-latest
            target: --win
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build installer
        shell: bash
        run: |
          # An EMPTY signing variable is worse than an absent one. A repository
          # without these secrets still defines them as "", and electron-builder
          # keeps empty strings on purpose ("allow to specify as empty string"),
          # so its null check passes, it resolves "" as a certificate path
          # against the project directory, and dies with "<projectDir> not a
          # file". Unset them instead, so signing is genuinely skipped.
          EXTRA=""
          if [ -z "${CSC_LINK:-}" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # Without a certificate electron-builder skips signing ENTIRELY --
            # its schema is explicit that "there is no automatic ad-hoc
            # fallback". An unsigned arm64 binary cannot execute on Apple
            # Silicon at all, so opt into ad-hoc signing. This does not avoid
            # Gatekeeper (that needs notarisation); it makes the app runnable
            # once the user allows it.
            #
            # Hardened runtime stays ON in both paths: notarisation requires it,
            # and electron-builder's default entitlements already grant
            # com.apple.security.cs.disable-library-validation, which is what
            # lets ad-hoc signing coexist with it.
            if [ "${{ runner.os }}" = "macOS" ]; then
              EXTRA="--config.mac.identity=-"
            fi
          fi
          if [ -z "${APPLE_ID:-}" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          npx electron-builder ${{ matrix.target }} --publish never $EXTRA
        env:
          # Signing and notarisation are optional; each block above drops these
          # entirely unless a real value was supplied.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: lichesspro-${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.exe
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.exe
          draft: true
          body: |
            Download the installer for your system below.

            **macOS** — these builds are not notarised, so the first open is
            blocked with "Apple could not verify this app is free of malware".
            Open it once, then go to System Settings → Privacy & Security and
            click **Open Anyway** next to the message. (On macOS 15 and later
            the old right-click → Open shortcut no longer works.)

            **Windows** — SmartScreen may warn about an unrecognised app.
            Choose More info, then Run anyway.
